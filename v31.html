<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f6f5f2"><title>내 옷장</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#f6f5f2;color:#171717}header{padding:calc(24px + env(safe-area-inset-top)) 18px 16px;background:#fff;position:sticky;top:0;z-index:3;border-bottom:1px solid #eee}h1{margin:0;font-size:28px}.sub{color:#777;margin-top:5px;font-size:14px}main{padding:16px 14px 110px;max-width:760px;margin:auto}.card{background:#fff;border-radius:20px;padding:17px;margin-bottom:14px;border:1px solid #eee}.row{display:flex;gap:8px}.row>*{flex:1}button{border:0;border-radius:13px;padding:12px 14px;font-size:15px;font-weight:700;background:#171717;color:#fff}button.secondary{background:#eee;color:#333}button.ghost{background:#f1f1f1;color:#666;padding:7px 9px;font-size:12px}button.danger{background:#f7eeee;color:#a33;padding:7px 9px;font-size:12px}input,select{width:100%;padding:12px;margin:5px 0;border:1px solid #ddd;border-radius:12px;font-size:16px;background:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.item{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #e8e8e8}.item img{width:100%;height:205px;object-fit:cover;background:#eee}.info{padding:10px;font-size:13px;line-height:1.5}.title{font-weight:750;font-size:15px}.muted{color:#888}.chips{display:flex;gap:6px;overflow:auto;padding:0 0 12px}.chip{white-space:nowrap;background:#fff;color:#555;border:1px solid #ddd;padding:8px 11px;font-size:13px}.chip.on{background:#171717;color:#fff}.empty{text-align:center;color:#888;padding:55px 10px}.page{display:none}.page.active{display:block}nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;border-top:1px solid #ddd;display:flex;padding:7px 7px calc(7px + env(safe-area-inset-bottom));z-index:5}nav button{flex:1;background:transparent;color:#888;padding:10px 2px;font-size:12px}nav button.active{color:#111}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.stat{background:#fff;border:1px solid #eee;border-radius:15px;padding:12px;text-align:center}.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:#888}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}.sheet img{width:100%;max-height:280px;object-fit:contain;background:#eee;border-radius:14px;margin-bottom:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.actions button{flex:1}.box{border:1px dashed #ccc;border-radius:16px;padding:14px;margin-top:12px}.small{font-size:12px;color:#888;line-height:1.45}.version{text-align:center;font-size:11px;color:#aaa;margin-top:10px}</style></head><body><header><h1>내 옷장</h1><div class="sub" id="summary">불러오는 중...</div></header><main><section id="closet" class="page active"><div class="stats"><div class="stat"><b id="total">0</b><span>전체</span></div><div class="stat"><b id="worn">0</b><span>착용 기록</span></div><div class="stat"><b id="saved">0</b><span>저장 코디</span></div></div><div class="chips" id="filters"></div><div id="items" class="grid"></div><div id="empty" class="empty">아직 등록된 옷이 없습니다.</div></section><section id="add" class="page"><div class="card"><h2>옷 등록</h2><input id="photo" type="file" accept="image/*" multiple><select id="category"></select><select id="type"></select><div class="row"><select id="color"></select><select id="season"></select></div><select id="formality"><option value="1">캐주얼</option><option value="2" selected>스마트캐주얼</option><option value="3">비즈니스</option><option value="4">포멀</option></select><input id="memo" placeholder="메모"><button id="addBtn" onclick="addClothes()">선택한 사진 등록</button><div class="box"><b>옷장 백업 · 복원</b><p class="small">사진, 옷 정보, 착용 기록, 저장 코디를 JSON 파일로 보관합니다.</p><div class="row"><button class="secondary" onclick="exportBackup()">백업 만들기</button><button class="secondary" onclick="restorePicker.click()">백업 복원</button></div><input id="restorePicker" type="file" accept="application/json,.json" style="display:none" onchange="restoreBackup(this.files[0])"><p class="small">복원은 현재 옷장을 백업 내용으로 교체합니다.</p></div><div class="version">Wardrobe v3.1</div></div></section><section id="recommend" class="page"><div class="card"><h2>코디 추천</h2><p class="small">상의와 하의를 등록하면 색상, 격식, 계절, 최근 착용 빈도를 반영해 추천합니다.</p><button onclick="simpleRecommend()">내 옷으로 추천</button><div id="result"></div></div></section></main><nav><button class="active" onclick="showPage('closet',this)">옷장</button><button onclick="showPage('add',this)">옷 등록</button><button onclick="showPage('recommend',this)">코디 추천</button></nav><div id="editModal" class="modal" onclick="if(event.target===this)closeEdit()"><div class="sheet"><h2>옷 정보 수정</h2><img id="editImg"><select id="editCategory"></select><select id="editType"></select><div class="row"><select id="editColor"></select><select id="editSeason"></select></div><select id="editFormality"><option value="1">캐주얼</option><option value="2">스마트캐주얼</option><option value="3">비즈니스</option><option value="4">포멀</option></select><input id="editMemo" placeholder="메모"><div class="actions"><button onclick="saveEdit()">저장</button><button class="secondary" onclick="closeEdit()">취소</button></div></div></div><script>const DB='wardrobeDB',VER=1;let db,clothes=[],outfits=[],filter='전체',editingId=null;const cats=['상의','하의','아우터','신발','가방','액세서리'];const colors=['검정','흰색','아이보리/크림','네이비','회색','베이지','브라운','카키/올리브','블루','그린','와인/버건디','기타'];const seasons=['사계절','봄/가을','여름','겨울'];const types={상의:['티셔츠','셔츠','니트','맨투맨','후드','폴로','기타'],하의:['슬랙스','데님','치노','카고','쇼츠','기타'],아우터:['재킷','블레이저','코트','블루종','패딩','가디건','기타'],신발:['스니커즈','로퍼','구두','부츠','샌들','기타'],가방:['백팩','토트','크로스백','브리프케이스','기타'],액세서리:['벨트','모자','기타']};function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,VER);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('clothes'))d.createObjectStore('clothes',{keyPath:'id'});if(!d.objectStoreNames.contains('outfits'))d.createObjectStore('outfits',{keyPath:'id'})};r.onsuccess=e=>{db=e.target.result;res()};r.onerror=()=>rej(r.error)})}function all(s){return new Promise((res,rej)=>{const r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(s,o){return new Promise((res,rej)=>{const r=db.transaction(s,'readwrite').objectStore(s).put(o);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function clearS(s){return new Promise((res,rej)=>{const r=db.transaction(s,'readwrite').objectStore(s).clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}async function refresh(){clothes=await all('clothes');outfits=await all('outfits');render()}function fill(){category.innerHTML=cats.map(x=>`<option>${x}</option>`).join('');color.innerHTML=colors.map(x=>`<option>${x}</option>`).join('');season.innerHTML=seasons.map(x=>`<option>${x}</option>`).join('');setType(category.value,type);category.onchange=()=>setType(category.value,type)}function setType(c,t,v=''){t.innerHTML='<option value="">세부 종류 선택</option>'+types[c].map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}function showPage(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');b.classList.add('active')}function f2b(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height,m=1200;if(Math.max(w,h)>m){const s=m/Math.max(w,h);w*=s;h*=s}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>{URL.revokeObjectURL(u);res(b)},'image/jpeg',.82)};img.onerror=rej;img.src=u})}async function addClothes(){const fs=[...photo.files];if(!fs.length)return alert('사진을 선택해주세요.');for(const f of fs)await put('clothes',{id:crypto.randomUUID(),image:await f2b(f),category:category.value,type:type.value,color:color.value,season:season.value,formality:+formality.value,memo:memo.value.trim(),createdAt:Date.now(),wearCount:0,lastWorn:null});photo.value='';await refresh();alert(fs.length+'벌 등록 완료')}function imgURL(b){return URL.createObjectURL(b)}function render(){total.textContent=clothes.length;worn.textContent=clothes.reduce((a,c)=>a+(c.wearCount||0),0);saved.textContent=outfits.length;summary.textContent=`옷 ${clothes.length}벌 · 저장 코디 ${outfits.length}개`;const fc=['전체',...cats];filters.innerHTML=fc.map(c=>`<button class="chip ${filter===c?'on':''}" onclick="setFilter('${c}')">${c}</button>`).join('');const arr=(filter==='전체'?clothes:clothes.filter(c=>c.category===filter)).slice().sort((a,b)=>b.createdAt-a.createdAt);items.innerHTML='';empty.style.display=arr.length?'none':'block';for(const c of arr){const d=document.createElement('div');d.className='item';d.innerHTML=`<img src="${imgURL(c.image)}" onclick="openEdit('${c.id}')"><div class="info"><div class="title">${c.memo||c.type||c.category}</div><span class="muted">${c.category}${c.type?' · '+c.type:''} · ${c.color||'기타'}</span><br><span class="muted">${c.season||'사계절'} · 착용 ${c.wearCount||0}회</span><div class="actions"><button class="ghost" onclick="openEdit('${c.id}')">수정</button><button class="ghost" onclick="wear('${c.id}')">오늘 입음</button></div></div>`;items.appendChild(d)}}function setFilter(c){filter=c;render()}async function wear(id){const c=clothes.find(x=>x.id===id);c.wearCount=(c.wearCount||0)+1;c.lastWorn=Date.now();await put('clothes',c);await refresh()}function openEdit(id){const c=clothes.find(x=>x.id===id);editingId=id;editImg.src=imgURL(c.image);editCategory.innerHTML=cats.map(x=>`<option ${x===c.category?'selected':''}>${x}</option>`).join('');setType(c.category,editType,c.type||'');editColor.innerHTML=colors.map(x=>`<option ${x===(c.color||'기타')?'selected':''}>${x}</option>`).join('');editSeason.innerHTML=seasons.map(x=>`<option ${x===(c.season||'사계절')?'selected':''}>${x}</option>`).join('');editFormality.value=String(c.formality||2);editMemo.value=c.memo||'';editCategory.onchange=()=>setType(editCategory.value,editType);editModal.classList.add('open')}function closeEdit(){editModal.classList.remove('open')}async function saveEdit(){const c=clothes.find(x=>x.id===editingId);c.category=editCategory.value;c.type=editType.value;c.color=editColor.value;c.season=editSeason.value;c.formality=+editFormality.value;c.memo=editMemo.value.trim();await put('clothes',c);closeEdit();await refresh()}function b64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)})}function unb64(s){const [h,d]=s.split(','),m=(h.match(/data:(.*?);/)||[])[1]||'image/jpeg',bin=atob(d),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m})}async function exportBackup(){const cc=[];for(const c of clothes)cc.push({...c,image:await b64(c.image)});const blob=new Blob([JSON.stringify({app:'my-wardrobe',version:'3.1',createdAt:new Date().toISOString(),clothes:cc,outfits})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`wardrobe-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}async function restoreBackup(file){if(!file)return;try{const o=JSON.parse(await file.text());if(o.app!=='my-wardrobe'||!Array.isArray(o.clothes)||!Array.isArray(o.outfits))throw 0;if(!confirm(`옷 ${o.clothes.length}벌로 현재 옷장을 교체할까요?`))return;await clearS('clothes');await clearS('outfits');for(const c of o.clothes)await put('clothes',{...c,image:unb64(c.image)});for(const x of o.outfits)await put('outfits',x);await refresh();alert('복원 완료')}catch(e){alert('올바른 백업 파일이 아닙니다.')}}function simpleRecommend(){const t=clothes.find(c=>c.category==='상의'),b=clothes.find(c=>c.category==='하의');result.innerHTML=t&&b?`<p><b>${t.memo||t.type}</b> + <b>${b.memo||b.type}</b></p>`:'<p class="small">상의와 하의를 먼저 등록해주세요.</p>'}(async()=>{await openDB();fill();await refresh()})();</script></body></html>
