grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.recitem{background:#f7f7f7;border-radius:14px;overflow:hidden}.recitem img{width:100%;height:170px;object-fit:cover}.recitem div{padding:8px;font-size:12px}.reason{background:#f4f4f4;border-radius:13px;padding:11px;margin:10px 0;font-size:13px}.updatebar{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:50;background:#171717;color:#fff;border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:8px}.updatebar.show{display:flex}.updatebar span{flex:1;font-size:13px}.updatebar button{background:#fff;color:#171717;padding:8px 10px;font-size:12px}</style></head><body><div id="updateBar" class="updatebar"><span id="updateText"></span><button onclick="applyUpdate()">업데이트</button><button onclick="updateBar.classList.remove('show')">닫기</button></div><header><h1>내 옷장</h1><div class="sub" id="summary">불러오는 중...</div></header><main><section id="closet" class="page active"><div class="stats"><div class="stat"><b id="total">0</b><span>전체</span></div><div class="stat"><b id="worn">0</b><span>착용 기록</span></div><div class="stat"><b id="saved">0</b><span>저장 코디</span></div></div><div class="chips" id="filters"></div><div id="items" class="grid"></div><div id="empty" class="empty">아직 등록된 옷이 없습니다.</div></section><section id="add" class="page"><div class="card"><h2>옷 등록 <span class="badge">기기 내 AI 분류</span></h2><p class="small">처음 한 번만 이미지 분류 모델을 내려받습니다. 이후 사진은 아이폰 안에서 분석하며 외부 API나 별도 요금은 없습니다. AI 제안이 애매하면 자동 확정하지 않습니다.</p><input id="photo" type="file" accept="image/*" multiple><div id="modelStatus" class="small"></div><div id="queue" class="queue"></div><button id="batchBtn" style="display:none" onclick="saveBatch()">모두 저장</button><div class="box"><b>옷장 백업 · 복원</b><p class="small">사진과 옷 정보를 JSON 파일로 보관합니다.</p><div class="row"><button class="secondary" onclick="exportBackup()">백업 만들기</button><button class="secondary" onclick="restorePicker.click()">백업 복원</button></div><input id="restorePicker" type="file" accept="application/json,.json" hidden onchange="restoreBackup(this.files[0])"></div><div class="box"><b>앱 업데이트</b><p class="small">현재 버전 <b>v3.6</b></p><div class="row"><button class="secondary" onclick="checkUpdate(true)">최신 버전 확인</button><button class="secondary" onclick="forceReload()">강제 새로고침</button></div></div><div class="version">Wardrobe v3.6</div></div></section><section id="recommend" class="page"><div class="card"><h2>코디 추천</h2><div class="rec-controls"><select id="occasion"><option value="1">주말 / 편한 외출</option><option value="2" selected>데이트 / 스마트캐주얼</option><option value="3">출근 / 비즈니스</option><option value="4">격식 있는 자리</option></select><select id="weather"><option value="normal" selected>보통 날씨</option><option value="hot">더운 날</option><option value="cold">추운 날</option></select></div><button onclick="recommend()">내 옷으로 추천</button><div id="result"></div></div></section></main><nav><button class="active" onclick="showPage('closet',this)">옷장</button><button onclick="showPage('add',this)">옷 등록</button><button onclick="showPage('recommend',this)">코디 추천</button></nav><div id="editModal" class="modal" onclick="if(event.target===this)closeEdit()"><div class="sheet"><h2>옷 정보 수정</h2><img id="editImg"><select id="editCategory"></select><select id="editType"></select><div class="row"><select id="editColor"></select><select id="editSeason"></select></div><select id="editFormality"></select><input id="editMemo" placeholder="메모"><div class="actions"><button onclick="saveEdit()">저장</button><button class="secondary" onclick="closeEdit()">취소</button></div></div></div><script>const APP_VERSION='3.6',DB='wardrobeDB',VER=1,C=['상의','하의','아우터','신발','가방','액세서리'],COL=['검정','흰색','아이보리/크림','네이비','회색','베이지','브라운','카키/올리브','블루','그린','와인/버건디','기타'],SEA=['사계절','봄/가을','여름','겨울'],T={상의:['티셔츠','셔츠','니트','맨투맨','후드','폴로','기타'],하의:['슬랙스','데님','치노','카고','쇼츠','기타'],아우터:['재킷','블레이저','코트','블루종','패딩','가디건','기타'],신발:['스니커즈','로퍼','구두','부츠','샌들','기타'],가방:['백팩','토트','크로스백','브리프케이스','기타'],액세서리:['벨트','모자','기타']},FOR=[['1','캐주얼'],['2','스마트캐주얼'],['3','비즈니스'],['4','포멀']];let db,clothes=[],outfits=[],filter='전체',editingId=null,batch=[],latestVersion=APP_VERSION,visionModel=null,modelPromise=null;const $=id=>document.getElementById(id),opts=(a,v)=>a.map(x=>{let q=Array.isArray(x)?x[0]:x,l=Array.isArray(x)?x[1]:x;return `<option value="${q}" ${String(q)===String(v)?'selected':''}>${l}</option>`}).join('');function versionGt(a,b){let A=a.split('.').map(Number),B=b.split('.').map(Number);for(let i=0;i<Math.max(A.length,B.length);i++){if((A[i]||0)!==(B[i]||0))return(A[i]||0)>(B[i]||0)}return false}async function checkUpdate(m=false){try{let v=await(await fetch(`./version.json?t=${Date.now()}`,{cache:'no-store'})).json();latestVersion=v.version||APP_VERSION;if(versionGt(latestVersion,APP_VERSION)){updateText.textContent=`v${latestVersion} 업데이트가 있습니다.`;updateBar.classList.add('show')}else if(m)alert(`현재 v${APP_VERSION}가 최신 버전입니다.`)}catch(e){if(m)alert('버전 확인에 실패했습니다.')}}function applyUpdate(){location.replace(`./?v=${latestVersion}&t=${Date.now()}`)}function forceReload(){location.replace(`./?refresh=${Date.now()}`)}function openDB(){return new Promise((r,j)=>{let q=indexedDB.open(DB,VER);q.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('clothes'))d.createObjectStore('clothes',{keyPath:'id'});if(!d.objectStoreNames.contains('outfits'))d.createObjectStore('outfits',{keyPath:'id'})};q.onsuccess=e=>{db=e.target.result;r()};q.onerror=()=>j(q.error)})}function all(s){return new Promise(r=>{let q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>r(q.result)})}function put(s,o){return new Promise(r=>{let q=db.transaction(s,'readwrite').objectStore(s).put(o);q.onsuccess=r})}function clearS(s){return new Promise(r=>{let q=db.transaction(s,'readwrite').objectStore(s).clear();q.onsuccess=r})}async function refresh(){clothes=await all('clothes');outfits=await all('outfits');render()}function showPage(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');b.classList.add('active')}function url(b){return URL.createObjectURL(b)}function render(){$('total').textContent=clothes.length;$('worn').textContent=clothes.reduce((a,c)=>a+(c.wearCount||0),0);$('saved').textContent=outfits.length;$('summary').textContent=`옷 ${clothes.length}벌 · 저장 코디 ${outfits.length}개`;$('filters').innerHTML=['전체',...C].map(c=>`<button class="chip ${filter===c?'on':''}" onclick="filter='${c}';render()">${c}</button>`).join('');let a=(filter==='전체'?clothes:clothes.filter(c=>c.category===filter)).slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));$('empty').style.display=a.length?'none':'block';$('items').innerHTML=a.map(c=>`<div class="item"><img src="${url(c.image)}" onclick="openEdit('${c.id}')"><div class="info"><div class="title">${c.memo||c.type||c.category}</div><span class="muted">${c.category} · ${c.type||'기타'} · ${c.color||'기타'}</span><br><span class="muted">${c.season||'사계절'} · 착용 ${c.wearCount||0}회</span><div class="actions"><button class="ghost" onclick="openEdit('${c.id}')">수정</button><button class="ghost" onclick="wear('${c.id}')">오늘 입음</button></div></div></div>`).join('')}async function wear(id){let c=clothes.find(x=>x.id===id);c.wearCount=(c.wearCount||0)+1;c.lastWorn=Date.now();await put('clothes',c);refresh()}function f2b(f){return new Promise((r,j)=>{let im=new Image,u=URL.createObjectURL(f);im.onload=()=>{let w=im.width,h=im.height,m=1200;if(Math.max(w,h)>m){let s=m/Math.max(w,h);w*=s;h*=s}let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);c.toBlob(b=>{URL.revokeObjectURL(u);r(b)},'image/jpeg',.84)};im.onerror=j;im.src=u})}function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;let M=Math.max(r,g,b),m=Math.min(r,g,b),h=0,s=0,l=(M+m)/2;if(M!==m){let d=M-m;s=l>.5?d/(2-M-m):d/(M+m);h=M===r?(g-b)/d+(g<b?6:0):M===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s*100,l*100]}function classifyColor(r,g,b){let[h,s,l]=rgbToHsl(r,g,b);if(l<16)return'검정';if(s<4){if(l>89)return'흰색';if(l>73)return'아이보리/크림';return'회색'}if(h>=48&&h<118&&l<62){return s<22?'카키/올리브':h<100?'카키/올리브':'그린'}if(s<10){if(l>88)return'흰색';if(l>72)return'아이보리/크림';return'회색'}if(h>=195&&h<255)return l<34?'네이비':'블루';if(h>=70&&h<165)return(h<110&&l<55)?'카키/올리브':'그린';if(h>=35&&h<70)return l>68?'베이지':l<45?'브라운':'카키/올리브';if(h>=15&&h<35)return l<45?'브라운':'베이지';if((h>=330||h<15)&&l<48)return'와인/버건디';return'기타'}function median(a){a.sort((x,y)=>x-y);return a[Math.floor(a.length/2)]||240}function pixels(blob){return new Promise((r,j)=>{let im=new Image,u=URL.createObjectURL(blob);im.onload=()=>{let c=document.createElement('canvas');c.width=c.height=96;let x=c.getContext('2d');x.drawImage(im,0,0,96,96);URL.revokeObjectURL(u);r(x.getImageData(0,0,96,96).data)};im.onerror=j;im.src=u})}async function estimateColor(blob){let d=await pixels(blob),W=96,H=96,e=[[],[],[]];for(let y=0;y<H;y+=3)for(let x=0;x<W;x+=3)if(x<9||x>86||y<9||y>86){let i=(y*W+x)*4;e[0].push(d[i]);e[1].push(d[i+1]);e[2].push(d[i+2])}let bg=e.map(median),v={},sum={},wt={};for(let y=4;y<92;y++)for(let x=4;x<92;x++){let i=(y*W+x)*4,r=d[i],g=d[i+1],b=d[i+2];if(Math.hypot(r-bg[0],g-bg[1],b-bg[2])<30)continue;let[h,s,l]=rgbToHsl(r,g,b);if(s<4&&l>83)continue;let n=classifyColor(r,g,b),w=Math.max(.25,1-.55*(Math.abs(x-48)/48+Math.abs(y-48)/48))*(1+Math.min(s,60)/100);v[n]=(v[n]||0)+w;sum[n]=sum[n]||[0,0,0];sum[n][0]+=r*w;sum[n][1]+=g*w;sum[n][2]+=b*w;wt[n]=(wt[n]||0)+w}let n=(Object.entries(v).filter(x=>x[0]!=='기타').sort((a,b)=>b[1]-a[1])[0]||['기타'])[0],w=wt[n]||1,s=sum[n]||bg;return{name:n,rgb:s.map(x=>Math.round(x/w))}}function blobImage(blob){return new Promise((r,j)=>{let im=new Image,u=URL.createObjectURL(blob);im.onload=()=>{URL.revokeObjectURL(u);r(im)};im.onerror=j;im.src=u})}async function loadVisionModel(){if(visionModel)return visionModel;if(modelPromise)return modelPromise;modelPromise=(async()=>{try{$('modelStatus').textContent='AI 분류 모델 준비 중… 처음에는 잠시 걸릴 수 있습니다.';await tf.ready();visionModel=await mobilenet.load({version:2,alpha:.5});$('modelStatus').textContent='AI 분류 모델 준비 완료';return visionModel}catch(e){$('modelStatus').textContent='AI 모델을 불러오지 못했습니다. 카테고리는 직접 선택해주세요.';return null}})();return modelPromise}const MAP=[{keys:['jean','blue jean','denim'],c:'하의',t:'데님'},{keys:['miniskirt','skirt','sarong','hoopskirt'],c:'하의',t:''},{keys:['running shoe','sneaker'],c:'신발',t:'스니커즈'},{keys:['loafer'],c:'신발',t:'로퍼'},{keys:['cowboy boot','boot'],c:'신발',t:'부츠'},{keys:['sandal'],c:'신발',t:'샌들'},{keys:['backpack','knapsack','rucksack','haversack'],c:'가방',t:'백팩'},{keys:['purse','handbag','mailbag','shopping bag','tote'],c:'가방',t:'토트'},{keys:['trench coat','fur coat','overcoat','cloak','poncho'],c:'아우터',t:'코트'},{keys:['cardigan'],c:'아우터',t:'가디건'},{keys:['jersey','t-shirt','tee shirt'],c:'상의',t:'티셔츠'},{keys:['sweatshirt'],c:'상의',t:'맨투맨'},{keys:['shirt'],c:'상의',t:'셔츠'}];function mapPredictions(preds){let agg={};for(let p of preds){let label=p.className.toLowerCase();for(let m of MAP)if(m.keys.some(k=>label.includes(k))){let key=m.c+'|'+m.t;agg[key]=(agg[key]||0)+p.probability;break}}let a=Object.entries(agg).sort((x,y)=>y[1]-x[1]);if(!a.length)return{category:'',type:'',confidence:0,raw:preds[0]?.className||''};let[k,score]=a[0],[category,type]=k.split('|');return{category,type,confidence:score,raw:preds[0]?.className||''}}async function classifyGarment(blob){let model=await loadVisionModel();if(!model)return{category:'',type:'',confidence:0,raw:'모델 사용 불가'};try{let im=await blobImage(blob),preds=await model.classify(im,5);return mapPredictions(preds)}catch(e){return{category:'',type:'',confidence:0,raw:'분류 실패'}}}$('photo').onchange=async e=>{batch=[];let files=[...e.target.files];for(let f of files){let image=await f2b(f),col=await estimateColor(image);batch.push({image,category:'',type:'',color:col.name,autoColor:col.name,autoRgb:col.rgb,aiStatus:'분류 중…',aiRaw:'',aiConfidence:0,season:'사계절',formality:2,memo:''});renderQueue()}for(let i=0;i<batch.length;i++){let ai=await classifyGarment(batch[i].image),auto=ai.confidence>=.12;batch[i].aiStatus=auto?`추천: ${ai.category}${ai.type?' · '+ai.type:''}`:'분류 확인 필요';batch[i].aiRaw=ai.raw;batch[i].aiConfidence=ai.confidence;if(auto){batch[i].category=ai.category;batch[i].type=ai.type}renderQueue()}};function renderQueue(){$('batchBtn').style.display=batch.length?'block':'none';$('queue').innerHTML=batch.map((x,i)=>`<div class="q"><img src="${url(x.image)}"><div><div class="autoline ${x.category?'good':'warn'}"><b>${x.aiStatus}</b>${x.aiConfidence?` · ${Math.round(x.aiConfidence*100)}%`:''}</div>${x.aiRaw?`<div class="small muted">AI 원분류: ${x.aiRaw}</div>`:''}<div class="quick">${C.map(c=>`<button class="${x.category===c?'on':''}" onclick="qset(${i},'category','${c}')">${c}</button>`).join('')}</div><div class="autoline"><span class="dot" style="background:rgb(${x.autoRgb.join(',')})"></span> 색상 추천: <b>${x.autoColor}</b> <button class="ghost" onclick="reanalyze(${i})">다시 분석</button></div><select onchange="qset(${i},'type',this.value)"><option value="">세부 종류</option>${x.category?opts(T[x.category],x.type):''}</select><div class="row"><select onchange="qset(${i},'color',this.value)">${opts(COL,x.color)}</select><select onchange="qset(${i},'season',this.value)">${opts(SEA,x.season)}</select></div><select onchange="qset(${i},'formality',+this.value)">${opts(FOR,x.formality)}</select><input placeholder="메모" value="${x.memo||''}" onchange="qset(${i},'memo',this.value)"></div></div>`).join('')}async function reanalyze(i){let col=await estimateColor(batch[i].image),ai=await classifyGarment(batch[i].image),auto=ai.confidence>=.12;Object.assign(batch[i],{color:col.name,autoColor:col.name,autoRgb:col.rgb,aiStatus:auto?`추천: ${ai.category}${ai.type?' · '+ai.type:''}`:'분류 확인 필요',aiRaw:ai.raw,aiConfidence:ai.confidence,category:auto?ai.category:'',type:auto?ai.type:''});renderQueue()}function qset(i,k,v){batch[i][k]=v;if(k==='category'){batch[i].type='';batch[i].aiStatus='사용자 선택';renderQueue()}}async function saveBatch(){let miss=batch.filter(x=>!x.category);if(miss.length){alert(`카테고리가 선택되지 않은 사진이 ${miss.length}장 있습니다.`);return}for(let x of batch){let y={...x};delete y.autoColor;delete y.autoRgb;delete y.aiStatus;delete y.aiRaw;delete y.aiConfidence;await put('clothes',{...y,id:crypto.randomUUID(),createdAt:Date.now(),wearCount:0,lastWorn:null})}let n=batch.length;batch=[];$('photo').value='';renderQueue();await refresh();alert(`${n}벌 등록 완료`)}function openEdit(id){let c=clothes.find(x=>x.id===id);editingId=id;$('editImg').src=url(c.image);$('editCategory').innerHTML=opts(C,c.category);$('editType').innerHTML='<option value="">세부 종류</option>'+opts(T[c.category],c.type);$('editColor').innerHTML=opts(COL,c.color||'기타');$('editSeason').innerHTML=opts(SEA,c.season||'사계절');$('editFormality').innerHTML=opts(FOR,c.formality||2);$('editMemo').value=c.memo||'';$('editCategory').onchange=()=>{$('editType').innerHTML='<option value="">세부 종류</option>'+opts(T[$('editCategory').value],'')};$('editModal').classList.add('open')}function closeEdit(){$('editModal').classList.remove('open')}async function saveEdit(){let c=clothes.find(x=>x.id===editingId);c.category=$('editCategory').value;c.type=$('editType').value;c.color=$('editColor').value;c.season=$('editSeason').value;c.formality=+$('editFormality').value;c.memo=$('editMemo').value.trim();await put('clothes',c);closeEdit();refresh()}function b64(b){return new Promise(r=>{let f=new FileReader;f.onload=()=>r(f.result);f.readAsDataURL(b)})}function blob(s){let[h,d]=s.split(','),bin=atob(d),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:(h.match(/data:(.*?);/)||[])[1]||'image/jpeg'})}async function exportBackup(){let cc=[];for(let c of clothes)cc.push({...c,image:await b64(c.image)});let b=new Blob([JSON.stringify({app:'my-wardrobe',version:APP_VERSION,createdAt:new Date().toISOString(),clothes:cc,outfits})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`wardrobe-backup-${new Date().toISOString().slice(0,10)}.json`;a.click()}async function restoreBackup(f){if(!f)return;try{let o=JSON.parse(await f.text());if(o.app!=='my-wardrobe'||!Array.isArray(o.clothes))throw 0;if(!confirm(`옷 ${o.clothes.length}벌로 현재 옷장을 교체할까요?`))return;await clearS('clothes');await clearS('outfits');for(let c of o.clothes)await put('clothes',{...c,image:blob(c.image)});for(let x of(o.outfits||[]))await put('outfits',x);await refresh();alert('복원 완료')}catch(e){alert('올바른 백업 파일이 아닙니다.')}}const neutral=['검정','흰색','아이보리/크림','네이비','회색','베이지','브라운'];function colorScore(a,b){if(a===b)return 1;if(neutral.includes(a)||neutral.includes(b))return 3;let pairs=[['카키/올리브','네이비'],['카키/올리브','블루'],['카키/올리브','아이보리/크림'],['블루','브라운'],['블루','베이지']];return pairs.some(p=>p.includes(a)&&p.includes(b))?3:1}function itemScore(c,t,w){let s=5-Math.abs((+c.formality||2)-t)*2+(c.season==='사계절'?2:1);s+=c.lastWorn?Math.min(2,(Date.now()-c.lastWorn)/604800000):2;return s}function recommend(){let t=+$('occasion').value,w=$('weather').value,Tp=clothes.filter(c=>c.category==='상의'),Bp=clothes.filter(c=>c.category==='하의'),Sp=clothes.filter(c=>c.category==='신발');if(!Tp.length||!Bp.length)return $('result').innerHTML='<p class="small">상의와 하의를 먼저 등록해주세요.</p>';let z=[];for(let a of Tp)for(let b of Bp){let s=itemScore(a,t,w)+itemScore(b,t,w)+colorScore(a.color,b.color),sh=Sp.slice().sort((x,y)=>itemScore(y,t,w)-itemScore(x,t,w))[0];if(sh)s+=itemScore(sh,t,w);z.push({a,b,sh,s})}z.sort((a,b)=>b.s-a.s);let q=z[0],arr=[q.a,q.b,q.sh].filter(Boolean);$('result').innerHTML=`<div class="reason">현재 등록된 옷 중 균형 점수가 가장 높은 조합입니다.</div><div class="recgrid">${arr.map(c=>`<div class="recitem"><img src="${url(c.image)}"><div><b>${c.memo||c.type||c.category}</b><br>${c.color}</div></div>`).join('')}</div>`}(async()=>{await openDB();await refresh();checkU
