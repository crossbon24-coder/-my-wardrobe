<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f6f5f2"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>내 옷장</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#f6f5f2;color:#171717}header{padding:calc(24px + env(safe-area-inset-top)) 18px 16px;background:#fff;border-bottom:1px solid #eee}h1{margin:0;font-size:28px}.sub,.muted,.small{color:#888}.sub{margin-top:5px;font-size:14px}main{padding:16px 14px 110px;max-width:760px;margin:auto}.card{background:#fff;border:1px solid #eee;border-radius:20px;padding:17px;margin-bottom:14px}.row{display:flex;gap:8px}.row>*{flex:1}button{border:0;border-radius:13px;padding:12px;font-size:15px;font-weight:700;background:#171717;color:#fff}.secondary,.ghost{background:#eee;color:#444}.ghost{padding:8px;font-size:12px}input,select{width:100%;padding:12px;margin:5px 0;border:1px solid #ddd;border-radius:12px;font-size:16px;background:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.item{background:#fff;border:1px solid #e8e8e8;border-radius:16px;overflow:hidden}.item img{width:100%;height:205px;object-fit:cover;background:#eee}.info{padding:10px;font-size:13px;line-height:1.5}.title{font-weight:750;font-size:15px}.actions{display:flex;gap:7px;margin-top:8px}.actions>*{flex:1}.chips{display:flex;gap:6px;overflow:auto;padding-bottom:12px}.chip{white-space:nowrap;background:#fff;color:#555;border:1px solid #ddd;padding:8px 11px;font-size:13px}.chip.on{background:#171717;color:#fff}.page{display:none}.page.active{display:block}.empty{text-align:center;color:#888;padding:55px 10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.stat{background:#fff;border:1px solid #eee;border-radius:15px;padding:12px;text-align:center}.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:#888}nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;border-top:1px solid #ddd;display:flex;padding:7px 7px calc(7px + env(safe-area-inset-bottom));z-index:5}nav button{flex:1;background:transparent;color:#888;font-size:12px}nav button.active{color:#111}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}.sheet img{width:100%;max-height:280px;object-fit:contain;background:#eee;border-radius:14px}.box{border:1px dashed #ccc;border-radius:16px;padding:14px;margin-top:12px}.small{font-size:12px;line-height:1.5}.version{text-align:center;font-size:11px;color:#aaa;margin-top:10px}.queue{display:grid;gap:10px;margin:12px 0}.q{display:grid;grid-template-columns:82px 1fr;gap:10px;background:#f7f7f7;border-radius:15px;padding:9px}.q img{width:82px;height:110px;object-fit:cover;border-radius:10px;background:#ddd}.q select,.q input{font-size:13px;padding:8px;margin:2px 0}.badge{font-size:12px;background:#eee;border-radius:999px;padding:5px 9px;display:inline-block}.quick{display:flex;gap:5px;overflow:auto;margin:3px 0 6px}.quick button{padding:7px 9px;font-size:11px;white-space:nowrap;background:#e9e9e9;color:#555}.quick button.on{background:#171717;color:#fff}.autoline{display:flex;align-items:center;gap:6px;font-size:11px;color:#666;margin:4px 0}.dot{width:12px;height:12px;border-radius:50%;border:1px solid #bbb;display:inline-block}.rec-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.rec{margin-top:14px;border-top:1px solid #eee;padding-top:14px}.recgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.recitem{background:#f7f7f7;border-radius:14px;overflow:hidden}.recitem img{width:100%;height:170px;object-fit:cover;background:#eee}.recitem div{padding:8px;font-size:12px}.reason{background:#f4f4f4;border-radius:13px;padding:11px;margin:10px 0;font-size:13px;line-height:1.5}.updatebar{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:50;background:#171717;color:#fff;border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:8px;box-shadow:0 8px 30px #0003}.updatebar.show{display:flex}.updatebar span{flex:1;font-size:13px}.updatebar button{background:#fff;color:#171717;padding:8px 10px;font-size:12px}</style></head><body><div id="updateBar" class="updatebar"><span id="updateText">새 버전이 있습니다.</span><button onclick="applyUpdate()">업데이트</button><button onclick="updateBar.classList.remove('show')">닫기</button></div><header><h1>내 옷장</h1><div class="sub" id="summary">불러오는 중...</div></header><main><section id="closet" class="page active"><div class="stats"><div class="stat"><b id="total">0</b><span>전체</span></div><div class="stat"><b id="worn">0</b><span>착용 기록</span></div><div class="stat"><b id="saved">0</b><span>저장 코디</span></div></div><div class="chips" id="filters"></div><div id="items" class="grid"></div><div id="empty" class="empty">아직 등록된 옷이 없습니다.</div></section><section id="add" class="page"><div class="card"><h2>옷 등록 <span class="badge">색상 자동추정</span></h2><p class="small">사진을 고르면 기기에서 대표 색상을 추정해 미리 선택합니다. 사진은 외부 서버로 전송되지 않습니다.</p><input id="photo" type="file" accept="image/*" multiple><div id="queue" class="queue"></div><button id="batchBtn" style="display:none" onclick="saveBatch()">모두 저장</button><div class="box"><b>옷장 백업 · 복원</b><p class="small">사진, 옷 정보, 착용 기록, 저장 코디를 파일로 보관합니다.</p><div class="row"><button class="secondary" onclick="exportBackup()">백업 만들기</button><button class="secondary" onclick="restorePicker.click()">백업 복원</button></div><input id="restorePicker" type="file" accept="application/json,.json" hidden onchange="restoreBackup(this.files[0])"></div><div class="box"><b>앱 업데이트</b><p class="small">현재 버전 <b>v3.5</b></p><div class="row"><button class="secondary" onclick="checkUpdate(true)">최신 버전 확인</button><button class="secondary" onclick="forceReload()">강제 새로고침</button></div></div><div class="version">Wardrobe v3.5</div></div></section><section id="recommend" class="page"><div class="card"><h2>코디 추천 <span class="badge">점수 기반</span></h2><p class="small">색 조합, 계절, 격식도, 착용 빈도를 함께 반영합니다.</p><div class="rec-controls"><select id="occasion"><option value="1">주말 / 편한 외출</option><option value="2" selected>데이트 / 스마트캐주얼</option><option value="3">출근 / 비즈니스</option><option value="4">격식 있는 자리</option></select><select id="weather"><option value="normal" selected>보통 날씨</option><option value="hot">더운 날</option><option value="cold">추운 날</option></select></div><button onclick="recommend()">내 옷으로 추천</button><div id="result"></div></div></section></main><nav><button class="active" onclick="showPage('closet',this)">옷장</button><button onclick="showPage('add',this)">옷 등록</button><button onclick="showPage('recommend',this)">코디 추천</button></nav><div id="editModal" class="modal" onclick="if(event.target===this)closeEdit()"><div class="sheet"><h2>옷 정보 수정</h2><img id="editImg"><select id="editCategory"></select><select id="editType"></select><div class="row"><select id="editColor"></select><select id="editSeason"></select></div><select id="editFormality"></select><input id="editMemo" placeholder="메모"><div class="actions"><button onclick="saveEdit()">저장</button><button class="secondary" onclick="closeEdit()">취소</button></div></div></div><script>const APP_VERSION='3.5',DB='wardrobeDB',VER=1,C=['상의','하의','아우터','신발','가방','액세서리'],COL=['검정','흰색','아이보리/크림','네이비','회색','베이지','브라운','카키/올리브','블루','그린','와인/버건디','기타'],SEA=['사계절','봄/가을','여름','겨울'],T={상의:['티셔츠','셔츠','니트','맨투맨','후드','폴로','기타'],하의:['슬랙스','데님','치노','카고','쇼츠','기타'],아우터:['재킷','블레이저','코트','블루종','패딩','가디건','기타'],신발:['스니커즈','로퍼','구두','부츠','샌들','기타'],가방:['백팩','토트','크로스백','브리프케이스','기타'],액세서리:['벨트','모자','기타']},FOR=[['1','캐주얼'],['2','스마트캐주얼'],['3','비즈니스'],['4','포멀']];let db,clothes=[],outfits=[],filter='전체',editingId=null,batch=[],latestVersion=APP_VERSION;const $=id=>document.getElementById(id),opts=(a,v)=>a.map(x=>{let val=Array.isArray(x)?x[0]:x,lab=Array.isArray(x)?x[1]:x;return `<option value="${val}" ${String(val)===String(v)?'selected':''}>${lab}</option>`}).join('');function versionGt(a,b){let A=String(a).split('.').map(Number),B=String(b).split('.').map(Number);for(let i=0;i<Math.max(A.length,B.length);i++){let x=A[i]||0,y=B[i]||0;if(x!==y)return x>y}return false}async function checkUpdate(manual=false){try{let r=await fetch(`./version.json?t=${Date.now()}`,{cache:'no-store'}),v=await r.json();latestVersion=v.version||APP_VERSION;if(versionGt(latestVersion,APP_VERSION)){updateText.textContent=`v${latestVersion} 업데이트가 있습니다.`;updateBar.classList.add('show')}else if(manual)alert(`현재 v${APP_VERSION}가 최신 버전입니다.`)}catch(e){if(manual)alert('버전 확인에 실패했습니다.')}}function applyUpdate(){location.replace(`./?v=${latestVersion}&t=${Date.now()}`)}function forceReload(){location.replace(`./?refresh=${Date.now()}`)}function openDB(){return new Promise((r,j)=>{let q=indexedDB.open(DB,VER);q.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('clothes'))d.createObjectStore('clothes',{keyPath:'id'});if(!d.objectStoreNames.contains('outfits'))d.createObjectStore('outfits',{keyPath:'id'})};q.onsuccess=e=>{db=e.target.result;r()};q.onerror=()=>j(q.error)})}function all(s){return new Promise(r=>{let q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>r(q.result)})}function put(s,o){return new Promise(r=>{let q=db.transaction(s,'readwrite').objectStore(s).put(o);q.onsuccess=r})}function clearS(s){return new Promise(r=>{let q=db.transaction(s,'readwrite').objectStore(s).clear();q.onsuccess=r})}async function refresh(){clothes=await all('clothes');outfits=await all('outfits');render()}function showPage(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');b.classList.add('active')}function url(b){return URL.createObjectURL(b)}function render(){$('total').textContent=clothes.length;$('worn').textContent=clothes.reduce((a,c)=>a+(c.wearCount||0),0);$('saved').textContent=outfits.length;$('summary').textContent=`옷 ${clothes.length}벌 · 저장 코디 ${outfits.length}개`;$('filters').innerHTML=['전체',...C].map(c=>`<button class="chip ${filter===c?'on':''}" onclick="filter='${c}';render()">${c}</button>`).join('');let a=(filter==='전체'?clothes:clothes.filter(c=>c.category===filter)).slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));$('empty').style.display=a.length?'none':'block';$('items').innerHTML=a.map(c=>`<div class="item"><img src="${url(c.image)}" onclick="openEdit('${c.id}')"><div class="info"><div class="title">${c.memo||c.type||c.category}</div><span class="muted">${c.category} · ${c.type||'기타'} · ${c.color||'기타'}</span><br><span class="muted">${c.season||'사계절'} · 착용 ${c.wearCount||0}회</span><div class="actions"><button class="ghost" onclick="openEdit('${c.id}')">수정</button><button class="ghost" onclick="wear('${c.id}')">오늘 입음</button></div></div></div>`).join('')}async function wear(id){let c=clothes.find(x=>x.id===id);c.wearCount=(c.wearCount||0)+1;c.lastWorn=Date.now();await put('clothes',c);refresh()}function f2b(f){return new Promise((r,j)=>{let im=new Image,u=URL.createObjectURL(f);im.onload=()=>{let w=im.width,h=im.height,m=1200;if(Math.max(w,h)>m){let s=m/Math.max(w,h);w*=s;h*=s}let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);c.toBlob(b=>{URL.revokeObjectURL(u);r(b)},'image/jpeg',.82)};im.onerror=j;im.src=u})}function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;let max=Math.max(r,g,b),min=Math.min(r,g,b),h=0,s=0,l=(max+min)/2;if(max!==min){let d=max-min;s=l>.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4}h*=60}return[h,s*100,l*100]}function classifyColor(r,g,b){let[h,s,l]=rgbToHsl(r,g,b);if(l<18)return'검정';if(s<10){if(l>86)return'흰색';if(l>68)return'아이보리/크림';return'회색'}if(h>=200&&h<250){if(l<35)return'네이비';return'블루'}if(h>=70&&h<165){if(h<105&&l<52)return'카키/올리브';return'그린'}if(h>=35&&h<70){if(l>68)return'베이지';if(l<45)return'브라운';return'카키/올리브'}if(h>=15&&h<35){if(l<45)return'브라운';return'베이지'}if((h>=330||h<15)&&l<45)return'와인/버건디';return'기타'}function estimateColor(blob){return new Promise((res,rej)=>{let im=new Image,u=URL.createObjectURL(blob);im.onload=()=>{let c=document.createElement('canvas'),w=80,h=80;c.width=w;c.height=h;let x=c.getContext('2d');x.drawImage(im,0,0,w,h);let d=x.getImageData(0,0,w,h).data,rs=0,gs=0,bs=0,n=0;for(let i=0;i<d.length;i+=4){let r=d[i],g=d[i+1],b=d[i+2],max=Math.max(r,g,b),min=Math.min(r,g,b);if(r>242&&g>242&&b>242)continue;if(max-min<8&&max>218)continue;if(max<12)continue;rs+=r;gs+=g;bs+=b;n++}URL.revokeObjectURL(u);if(!n)return res({name:'기타',rgb:[160,160,160]});let rgb=[Math.round(rs/n),Math.round(gs/n),Math.round(bs/n)];res({name:classifyColor(...rgb),rgb})};im.onerror=rej;im.src=u})}$('photo').onchange=async e=>{batch=[];for(let f of e.target.files){let image=await f2b(f),est=await estimateColor(image);batch.push({image,category:'상의',type:'',color:est.name,autoColor:est.name,autoRgb:est.rgb,season:'사계절',formality:2,memo:''})}renderQueue()};function renderQueue(){$('batchBtn').style.display=batch.length?'block':'none';$('queue').innerHTML=batch.map((x,i)=>`<div class="q"><img src="${url(x.image)}"><div><div class="quick">${C.map(c=>`<button class="${x.category===c?'on':''}" onclick="qset(${i},'category','${c}')">${c}</button>`).join('')}</div><div class="autoline"><span class="dot" style="background:rgb(${(x.autoRgb||[160,160,160]).join(',')})"></span>자동 추정: <b>${x.autoColor||'기타'}</b><button class="ghost" onclick="reestimate(${i})">다시 추정</button></div><select onchange="qset(${i},'type',this.value)"><option value="">세부 종류</option>${opts(T[x.category],x.type)}</select><div class="row"><select onchange="qset(${i},'color',this.value)">${opts(COL,x.color)}</select><select onchange="qset(${i},'season',this.value)">${opts(SEA,x.season)}</select></div><select onchange="qset(${i},'formality',+this.value)">${opts(FOR,x.formality)}</select><input placeholder="메모" value="${x.memo}" onchange="qset(${i},'memo',this.value)"></div></div>`).join('')}async function reestimate(i){let est=await estimateColor(batch[i].image);batch[i].autoColor=est.name;batch[i].autoRgb=est.rgb;batch[i].color=est.name;renderQueue()}function qset(i,k,v){batch[i][k]=v;if(k==='category'){batch[i].type='';renderQueue()}}async function saveBatch(){if(!batch.length)return;for(let x of batch){let y={...x};delete y.autoColor;delete y.autoRgb;await put('clothes',{...y,id:crypto.randomUUID(),createdAt:Date.now(),wearCount:0,lastWorn:null})}let n=batch.length;batch=[];$('photo').value='';renderQueue();await refresh();alert(`${n}벌 등록 완료`)}function openEdit(id){let c=clothes.find(x=>x.id===id);editingId=id;$('editImg').src=url(c.image);$('editCategory').innerHTML=opts(C,c.category);$('editType').innerHTML='<option value="">세부 종류</option>'+opts(T[c.category],c.type);$('editColor').innerHTML=opts(COL,c.color||'기타');$('editSeason').innerHTML=opts(SEA,c.season||'사계절');$('editFormality').innerHTML=opts(FOR,c.formality||2);$('editMemo').value=c.memo||'';$('editCategory').onchange=()=>{$('editType').innerHTML='<option value="">세부 종류</option>'+opts(T[$('editCategory').value],'')};$('editModal').classList.add('open')}function closeEdit(){$('editModal').classList.remove('open')}async function saveEdit(){let c=clothes.find(x=>x.id===editingId);c.category=$('editCategory').value;c.type=$('editType').value;c.color=$('editColor').value;c.season=$('editSeason').value;c.formality=+$('editFormality').value;c.memo=$('editMemo').value.trim();await put('clothes',c);closeEdit();refresh()}function b64(b){return new Promise(r=>{let f=new FileReader;f.onload=()=>r(f.result);f.readAsDataURL(b)})}function blob(s){let[h,d]=s.split(','),bin=atob(d),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:(h.match(/data:(.*?);/)||[])[1]||'image/jpeg'})}async function exportBackup(){let cc=[];for(let c of clothes)cc.push({...c,image:await b64(c.image)});let b=new Blob([JSON.stringify({app:'my-wardrobe',version:APP_VERSION,createdAt:new Date().toISOString(),clothes:cc,outfits})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`wardrobe-backup-${new Date().toISOString().slice(0,10)}.json`;a.click()}async function restoreBackup(f){if(!f)return;try{let o=JSON.parse(await f.text());if(o.app!=='my-wardrobe'||!Array.isArray(o.clothes))throw 0;if(!confirm(`옷 ${o.clothes.length}벌로 현재 옷장을 교체할까요?`))return;await clearS('clothes');await clearS('outfits');for(let c of o.clothes)await put('clothes',{...c,image:blob(c.image)});for(let x of(o.outfits||[]))await put('outfits',x);await refresh();alert('복원 완료')}catch(e){alert('올바른 백업 파일이 아닙니다.')}}const neutral=['검정','흰색','아이보리/크림','네이비','회색','베이지','브라운'];function colorScore(a,b){if(!a||!b)return 1;if(a===b)return 1;if(neutral.includes(a)||neutral.includes(b))return 3;let pairs=[['카키/올리브','네이비'],['카키/올리브','블루'],['카키/올리브','아이보리/크림'],['블루','브라운'],['블루','베이지'],['와인/버건디','네이비'],['그린','네이비']];return pairs.some(p=>p.includes(a)&&p.includes(b))?3:1}function seasonScore(c,w){let s=c.season||'사계절';if(s==='사계절')return 2;if(w==='hot')return s==='여름'?3:s==='겨울'?-3:1;if(w==='cold')return s==='겨울'?3:s==='여름'?-3:1;return s==='봄/가을'?3:1}function freshScore(c){let wear=c.wearCount||0,days=c.lastWorn?(Date.now()-c.lastWorn)/86400000:999;return Math.max(0,3-Math.min(wear,3))+(days>7?2:days>2?1:0)}function itemScore(c,target,w){return 5-Math.abs((+c.formality||2)-target)*2+seasonScore(c,w)+freshScore(c)}function recommend(){let target=+$('occasion').value,w=$('weather').value,tops=clothes.filter(c=>c.category==='상의'),bottoms=clothes.filter(c=>c.category==='하의'),shoes=clothes.filter(c=>c.category==='신발'),outers=clothes.filter(c=>c.category==='아우터');if(!tops.length||!bottoms.length){$('result').innerHTML='<p class="small">상의와 하의를 먼저 등록해주세요.</p>';return}let combos=[];for(let t of tops)for(let p of bottoms){let base=itemScore(t,target,w)+itemScore(p,target,w)+colorScore(t.color,p.color),shoe=shoes.length?shoes.slice().sort((a,b)=>(itemScore(b,target,w)+colorScore(b.color,p.color))-(itemScore(a,target,w)+colorScore(a.color,p.color)))[0]:null,outer=(w==='cold'&&outers.length)?outers.slice().sort((a,b)=>itemScore(b,target,w)-itemScore(a,target,w))[0]:null,score=base+(shoe?itemScore(shoe,target,w)+colorScore(shoe.color,p.color):0)+(outer?itemScore(outer,target,w)+colorScore(outer.color,t.color):0);combos.push({t,p,shoe,outer,score})}combos.sort((a,b)=>b.score-a.score);let x=combos[0],arr=[x.t,x.p,x.shoe,x.outer].filter(Boolean),reasons=[];if(colorScore(x.t.color,x.p.color)>=3)reasons.push('상의·하의 색 조합이 안정적');if(Math.abs((+x.t.formality||2)-target)<=1&&Math.abs((+x.p.formality||2)-target)<=1)reasons.push('선택한 상황의 격식도와 잘 맞음');if(arr.some(c=>(c.wearCount||0)===0))reasons.push('아직 덜 입은 아이템을 우선 활용');$('result').innerHTML=`<div class="rec"><div class="reason"><b>추천 이유</b><br>${reasons.join(' · ')||'전체 균형 점수가 가장 높은 조합'}</div><div class="recgrid">${arr.map(c=>`<div class="recitem"><img src="${url(c.image)}"><div><b>${c.memo||c.type||c.category}</b><br><span class="muted">${c.category} · ${c.color||'기타'}</span></div></div>`).join('')}</div></div>`}(async()=>{await openDB();await refresh();checkUpdate(false);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate(false)})})();</script></body></html>
